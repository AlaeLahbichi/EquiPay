      - C'est un I ou un 1 dans mon code ?
      - Quel est le format du code ?

  - id: code_invalide
    answer: >-
      « Code invalide » signifie que le code n'existe pas ou n'est plus valable : vérifie les
      8 caractères, ou demande un nouveau code à l'owner, car il a pu le régénérer.
    keywords: [code, owner, nouveau]
    questions:
      - Pourquoi il me dit code invalide ?
      - Mon code ne marche pas
