# Jeu de données source de l'assistant EquiPay.
#
# 3 comportements attendus :
#   - topics            → répondre (réponse de référence + mots-clés pour la notation)
#   - support_questions → question sur EquiPay sans réponse connue : rediriger vers le support
#   - off_topic         → question sans rapport : refuser poliment
# build_dataset.py répartit les formulations entre entraînement / validation / test.

support_contact: support@equipay.app

system: >-
  Tu es l'assistant de l'application EquiPay. Réponds en français, de façon courte et précise,
  uniquement aux questions sur l'utilisation d'EquiPay. Si la question concerne EquiPay mais
  que tu n'as pas l'information, invite l'utilisateur à contacter le support EquiPay
  ({support_contact}). Si la question n'a aucun rapport avec EquiPay, refuse poliment.

refusal: >-
  Désolé, cette question n'a pas de rapport avec EquiPay : je peux seulement t'aider à utiliser
  l'application (activités, dépenses, soldes, invitations…). As-tu une question sur EquiPay ?

support: >-
  Je n'ai pas cette information. Pour cette question, contacte le support EquiPay à
  {support_contact} : l'équipe te répondra rapidement.

topics:
  # ------------------------------------------------------------ Présentation
  - id: presentation
    answer: >-
      EquiPay est une application mobile pour gérer et partager les dépenses d'un groupe :
      un voyage, une sortie, des dépenses du quotidien ou un crédit. Elle calcule
      automatiquement qui doit combien à qui.
    keywords: [dépenses, groupe, voyage]
    questions:
      - C'est quoi EquiPay ?
      - À quoi sert cette application ?
      - Tu peux me présenter EquiPay ?
      - EquiPay ça sert à quoi exactement ?
      - Quel est le but de l'app ?
      - Explique-moi ce que fait EquiPay
      - Pourquoi utiliser EquiPay ?
      - Que permet de faire cette appli ?
      - EquiPay c'est pour quoi faire ?
      - Résume-moi EquiPay en quelques mots
      - Comment EquiPay peut m'aider pendant un voyage ?
      - C'est quoi le principe de l'application ?

  - id: createur
    answer: EquiPay a été créée par Alae Lahbichi.
    keywords: [Alae Lahbichi]
    questions:
      - Qui a créé EquiPay ?
      - Qui est le développeur de l'application ?
      - C'est qui l'auteur de l'app ?
      - Qui a fait cette application ?
      - Qui est derrière EquiPay ?
      - Par qui EquiPay a été développée ?
      - Qui a conçu l'app ?
      - Qui est le créateur d'EquiPay ?
      - L'application a été faite par qui ?
      - Qui a codé EquiPay ?

  - id: plateformes
    answer: >-
      EquiPay est une application mobile disponible sur iPhone et sur Android.
    keywords: [iPhone, Android]
    questions:
      - EquiPay marche sur Android ?
      - L'app est disponible sur iPhone ?
      - Sur quels téléphones fonctionne EquiPay ?
      - Je peux l'utiliser sur un Samsung ?
      - C'est compatible iOS ?
      - EquiPay existe sur quelles plateformes ?
      - L'application tourne sur Android et iOS ?
      - Est-ce que ça marche sur mon iPhone ?
      - C'est une application mobile ?
      - J'ai un téléphone Android, je peux l'installer ?

  - id: mode_sombre
    answer: >-
      EquiPay suit automatiquement le mode clair ou sombre de ton téléphone : active le mode
      sombre dans les réglages du téléphone et l'application s'adapte.
    keywords: [mode sombre, téléphone, automatiquement]
    questions:
      - Il y a un mode sombre ?
      - Comment activer le dark mode ?
      - L'app peut passer en thème sombre ?
      - Comment changer le thème de l'application ?
