    keywords: [Requests, invitations, accepter, refuser]
    questions:
      - C'est quoi l'onglet Requests ?
      - À quoi sert Requests ?
      - Que trouve-t-on dans Requests ?
      - Requests ça veut dire quoi ?
      - Où sont les demandes que je reçois ?
      - Pourquoi j'ai une notification dans Requests ?
      - L'onglet des demandes sert à quoi ?
      - Que faire dans l'onglet Requests ?
      - Où voir mes demandes en attente ?
