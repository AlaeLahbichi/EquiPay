  - id: changer_username
    answer: >-
      Dans l'onglet Profile, modifie ton username. Il doit être unique et faire 3 à 30
      caractères : lettres minuscules, chiffres et « _ ».
    keywords: [Profile, unique, 3, 30]
    questions:
