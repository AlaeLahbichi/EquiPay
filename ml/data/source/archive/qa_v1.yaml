      - Comment sortir de mon compte EquiPay ?
      - Je veux me connecter avec un autre compte
      - Logout, comment faire ?

  - id: username
    answer: >-
      À l'inscription, ton username est créé automatiquement à partir de ton email ; s'il est
      déjà pris, des chiffres sont ajoutés. Tu peux le changer dans l'onglet Profile.
