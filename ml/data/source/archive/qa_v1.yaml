      - Je veux un autre pseudo

  - id: profil
    answer: >-
      Va dans l'onglet Profile, en bas à droite : tu peux y voir et modifier tes
      informations personnelles, comme ton nom, ton username et ta photo de profil.
    keywords: [Profile, nom, username, photo]
    questions:
