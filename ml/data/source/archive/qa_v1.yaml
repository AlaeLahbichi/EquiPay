      - Comment éditer mon profil ?

  - id: photo_profil
    answer: >-
      Dans l'onglet Profile, appuie sur ta photo : tu peux en choisir une dans ta galerie ou
      en prendre une avec l'appareil photo. Accepte l'accès aux photos si l'iPhone le demande.
