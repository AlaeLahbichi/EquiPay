      La barre du bas a 4 onglets : EquiPay (l'accueil avec tes activités), Requests (tes
      invitations), Free Card (bientôt disponible) et Profile (ton profil).
    keywords: [EquiPay, Requests, Free Card, Profile]
    questions:
      - Quels sont les onglets de l'app ?
      - À quoi servent les boutons en bas de l'écran ?
      - Comment est organisée l'application ?
      - C'est quoi les menus en bas ?
      - Explique-moi la barre de navigation
