    keywords: [Free Card, pas encore disponible]
    questions:
      - C'est quoi Free Card ?
      - À quoi sert l'onglet Free Card ?
      - Pourquoi Free Card est vide ?
      - Free Card ça marche comment ?
      - L'onglet Free Card est disponible ?
      - Quand est-ce que Free Card sera prêt ?
      - Il y a quoi dans Free Card ?
      - Free Card est en panne ?
      - Pourquoi rien ne s'affiche dans Free Card ?
      - C'est quoi la carte gratuite ?

  # ------------------------------------------------------------ Activités
  - id: types_activite
    answer: >-
      Il existe 4 types d'activité : Voyage, Sortie, Quotidien (dépenses du quotidien)
      et Crédit. Tu choisis le type quand tu crées l'activité.
    keywords: [Voyage, Sortie, Quotidien, Crédit]
    questions:
      - Quels types d'activité existent ?
      - Je peux créer autre chose qu'un voyage ?
      - C'est quoi les catégories d'activité ?
      - Quels sont les différents types ?
      - On peut gérer des sorties aussi ?
      - EquiPay marche aussi pour les dépenses du quotidien ?
      - Je peux suivre un crédit avec l'app ?
      - Quelles activités je peux créer ?
      - L'app est seulement pour les voyages ?
      - Je peux gérer les dépenses de ma colocation ?
      - Ça marche pour un week-end entre amis ?
      - On peut l'utiliser pour un prêt entre amis ?

  - id: creer_activite
    answer: >-
      Sur l'accueil, appuie sur le bouton rond orange « + », puis sur « Créer une activité ».
      Donne-lui un nom, choisis son type (Voyage, Sortie, Quotidien ou Crédit) et, si tu
      veux, un logo, puis appuie sur « Créer ».
    keywords: [+, Créer une activité, nom, type]
    questions:
      - Comment créer une activité ?
      - Comment je crée un voyage ?
      - Je veux créer une nouvelle activité
      - Comment ajouter un voyage ?
      - Comment on démarre un nouveau groupe de dépenses ?
      - Créer une sortie entre amis, comment faire ?
      - Où je crée une activité ?
      - Comment faire pour créer un nouveau voyage ?
      - Comment j'organise un nouveau voyage dans l'app ?
      - Comment lancer un nouveau projet de dépenses ?
      - Comment créer un groupe pour la coloc ?
      - Étapes pour créer une activité ?

  - id: logo_activite
    answer: >-
      Lors de la création, appuie sur le cercle en haut du formulaire : tu peux choisir une
      photo dans ta galerie ou en prendre une. Le logo est optionnel : sans logo, l'icône du
      type d'activité est utilisée.
    keywords: [galerie, photo, optionnel, icône]
    questions:
      - Comment mettre un logo à mon activité ?
      - Je peux ajouter une photo à mon voyage ?
      - Le logo de l'activité est obligatoire ?
      - Comment choisir l'image de l'activité ?
      - Comment personnaliser l'icône d'un voyage ?
      - Je n'ai pas mis de logo, c'est grave ?
      - Comment ajouter une image de couverture ?
      - Pourquoi mon activité a une icône d'avion ?
      - Je peux prendre une photo pour le logo ?
      - Comment revenir au logo par défaut ?
      - Le logo de mon voyage ne s'est pas envoyé

  - id: infos_activite
    answer: >-
      Une activité a un nom, une description, un logo, une devise par défaut (EUR par
      défaut) et, en option, des dates de début et de fin, un pays et une ville.
    keywords: [nom, devise, dates, pays, ville]
    questions:
      - Quelles informations contient une activité ?
      - Je peux mettre les dates du voyage ?
      - Comment indiquer la destination ?
      - Les dates de l'activité sont obligatoires ?
      - On peut ajouter une description à un voyage ?
      - Comment préciser le pays du voyage ?
      - Quels champs a une activité ?
      - Je peux indiquer la ville de la sortie ?
      - Comment renseigner le début et la fin du voyage ?
      - Que peut-on renseigner pour une activité ?

  - id: modifier_activite
    answer: >-
      Seul l'owner (le créateur) peut modifier une activité : son nom, sa description, son
      logo, sa devise, ses dates et son lieu.
    keywords: [owner, nom, logo]
    questions:
      - Comment modifier une activité ?
      - Comment renommer mon voyage ?
      - Je peux changer le logo après la création ?
      - Pourquoi je ne peux pas modifier ce voyage ?
      - Qui peut changer le nom de l'activité ?
      - Comment changer les dates d'une activité ?
      - Je me suis trompé de nom de voyage
      - Comment mettre à jour les infos d'une activité ?
      - Comment éditer une sortie ?
      - Je peux modifier la description du voyage ?

  - id: supprimer_activite
    answer: >-
      Seul l'owner peut supprimer une activité. Attention : cela efface définitivement toutes
      ses dépenses et ses photos, pour tous les membres.
    keywords: [owner, définitivement, dépenses, membres]
    questions:
      - Comment supprimer une activité ?
      - Comment effacer un voyage ?
      - Je peux supprimer un voyage terminé ?
      - Que se passe-t-il si je supprime une activité ?
      - Qui peut supprimer un voyage ?
      - Supprimer une activité efface les dépenses ?
      - Comment supprimer définitivement un groupe ?
      - Pourquoi je ne peux pas supprimer cette activité ?
      - Comment enlever une activité de ma liste ?
      - On peut récupérer une activité supprimée ?

  - id: devise
    answer: >-
      Chaque activité a une devise par défaut (EUR par défaut). Une dépense peut être dans
      une autre devise, par exemple en dirhams (MAD) : un taux de change convertit alors le
      montant pour calculer les totaux et les soldes.
    keywords: [devise, EUR, taux de change]
    questions:
      - Quelle devise utilise l'application ?
      - Je peux ajouter une dépense en dirhams ?
      - Comment gérer plusieurs devises ?
      - L'app gère les euros et les dollars ?
      - J'ai payé en MAD, comment je fais ?
      - Comment sont converties les devises ?
      - On peut changer de monnaie ?
      - Ça marche avec d'autres monnaies que l'euro ?
      - Comment fonctionne le taux de change ?
      - Mon voyage est en euros mais j'ai payé en dollars
      - Quelle est la devise par défaut ?
      - Comment changer la devise d'un voyage ?

  - id: rechercher_activite
    answer: >-
      Tu peux rechercher une activité par son nom et filtrer tes activités pour retrouver
      rapidement celle que tu veux.
    keywords: [rechercher, nom, filtrer]
    questions:
      - Comment retrouver un voyage ?
      - Comment rechercher une activité ?
      - J'ai beaucoup d'activités, comment m'y retrouver ?
      - Je peux chercher un voyage par son nom ?
      - Comment filtrer mes activités ?
      - Comment trouver une ancienne sortie ?
      - Il y a une barre de recherche pour les voyages ?
      - Comment trier mes activités ?
      - Je cherche un voyage de l'année dernière
      - Comment retrouver vite un groupe ?

  # ------------------------------------------------------------ Rôles
  - id: roles
    answer: >-
      Il y a 3 rôles : l'owner (le créateur) gère l'activité, le code et les invitations ;
      le membre voit tout et gère ses propres dépenses ; le spectateur peut seulement
      regarder, sans ajouter de dépense.
    keywords: [owner, membre, spectateur]
    questions:
      - Quels sont les rôles dans une activité ?
      - C'est quoi la différence entre membre et spectateur ?
      - Qui peut faire quoi dans un voyage ?
      - Explique-moi les rôles
      - C'est quoi un owner ?
      - Quels droits a un membre ?
      - Quels sont les différents statuts des participants ?
      - Owner, membre, spectateur, c'est quoi ?
      - Qui a le plus de droits dans un voyage ?
      - Quelles permissions ont les participants ?

  - id: owner
    answer: >-
      L'owner est le créateur de l'activité : il voit le code, invite des personnes, change
      les rôles, retire des membres et peut modifier ou supprimer l'activité.
    keywords: [créateur, code, invite, rôles]
    questions:
      - Que peut faire l'owner ?
      - C'est quoi le rôle du créateur ?
      - Quels sont les droits de l'owner ?
      - Je suis owner, je peux faire quoi ?
      - Le créateur a quels pouvoirs ?
      - Qu'est-ce que l'owner peut faire de plus ?
      - Pourquoi je suis owner de ce voyage ?
      - Je peux transférer le rôle d'owner ?
      - Qui est l'administrateur d'un voyage ?
      - L'owner peut tout modifier ?

  - id: spectateur
    answer: >-
      Un spectateur peut voir l'activité, les dépenses et les soldes, mais il ne peut pas
      ajouter de dépense et ne participe à aucune dépense. Seul l'owner peut le passer en
      membre.
    keywords: [voir, ne peut pas, dépense, owner]
    questions:
      - Que peut faire un spectateur ?
      - Pourquoi je ne peux pas ajouter de dépense ?
      - Un spectateur peut ajouter une dépense ?
      - Je suis spectateur, je peux faire quoi ?
      - Le bouton pour ajouter une dépense ne marche pas pour moi
      - Comment devenir membre au lieu de spectateur ?
      - À quoi sert le rôle spectateur ?
      - Un spectateur voit les soldes ?
      - Pourquoi inviter quelqu'un en spectateur ?
      - Le spectateur paye quelque chose ?

  - id: changer_role
    answer: >-
      Seul l'owner de l'activité peut changer les rôles : il peut passer un membre en
      spectateur, ou un spectateur en membre.
    keywords: [owner, membre, spectateur]
    questions:
      - Comment changer le rôle d'un participant ?
      - Comment passer quelqu'un en spectateur ?
      - Je peux promouvoir un spectateur en membre ?
      - Qui peut modifier les rôles ?
      - Comment rendre quelqu'un spectateur ?
      - Comment donner plus de droits à un participant ?
      - Un membre peut changer le rôle d'un autre ?
      - Comment retirer les droits d'un membre ?
      - Comment faire d'un spectateur un membre ?
      - Où je change les permissions ?

  # ------------------------------------------------------------ Rejoindre / inviter
  - id: rejoindre_code
    answer: >-
      Appuie sur le bouton « + » de l'accueil, puis « Rejoindre une activité », et saisis le
      code de 8 caractères envoyé par le créateur (par exemple FN3V-HM7S). Tu rejoins alors
      l'activité en tant que membre.
    keywords: [+, Rejoindre, code, 8, membre]
    questions:
      - Comment rejoindre une activité ?
      - Un ami m'a envoyé un code, j'en fais quoi ?
      - Comment rejoindre le voyage de mes amis ?
      - Où je mets le code d'une activité ?
      - Comment entrer dans un groupe existant ?
      - J'ai reçu un code de voyage, comment l'utiliser ?
      - Comment je rejoins un groupe avec un code ?
