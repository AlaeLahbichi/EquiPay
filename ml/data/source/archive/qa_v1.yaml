      - Comment naviguer dans EquiPay ?
      - C'est quoi les 4 icônes en bas ?
      - Comment se déplacer dans l'application ?
      - Quelles sections contient EquiPay ?

  - id: accueil
    answer: >-
      L'accueil (onglet EquiPay) affiche la liste de tes activités, les plus récentes d'abord,
      avec leur logo, leur nom et une flèche pour ouvrir le détail. Le bouton rond orange « + »
      permet d'en créer ou d'en rejoindre une.
    keywords: [activités, logo, flèche, +]
    questions:
      - Que montre la page d'accueil ?
      - À quoi sert l'écran principal ?
      - Où je vois mes activités ?
      - Comment ouvrir une activité ?
      - À quoi sert la flèche à droite ?
      - Où est la liste de mes voyages ?
      - C'est quoi le bouton orange avec un plus ?
      - Comment voir le détail d'une activité ?
      - Pourquoi mes activités sont dans cet ordre ?
      - Que contient l'onglet EquiPay ?

