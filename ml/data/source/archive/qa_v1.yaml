  - id: format_code
    answer: >-
      Le code fait 8 caractères, par exemple FN3V-HM7S. Tu peux le saisir en majuscules ou
      en minuscules, avec ou sans tiret. Il ne contient ni 0, ni O, ni 1, ni I pour éviter les
      confusions.
    keywords: [8, majuscules, tiret]
    questions:
      - Le code est en majuscules ou minuscules ?
      - Il faut mettre le tiret dans le code ?
      - Combien de caractères fait le code ?
