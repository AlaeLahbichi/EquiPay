  # ------------------------------------------------------------ Soldes
  - id: solde
    answer: >-
      Ton solde = ce que tu as payé − ta part des dépenses. Positif (en vert, avec +) :
      on te doit de l'argent. Négatif (en rouge, avec −) : tu dois de l'argent. À 0 : tu
      es à l'équilibre.
    keywords: [payé, part, positif, négatif]
    questions:
      - Comment est calculé mon solde ?
      - Que veut dire un solde négatif ?
      - Pourquoi mon solde est en rouge ?
      - Mon solde est positif, ça veut dire quoi ?
      - Comment savoir combien je dois ?
      - Comment savoir si on me doit de l'argent ?
      - C'est quoi le solde ?
      - Je comprends pas mon solde
      - Pourquoi mon solde est en vert ?
      - Que signifie un solde à zéro ?
      - Comment voir qui doit de l'argent ?
      - Explique-moi le calcul des soldes

  - id: solde_exemple
    answer: >-
      Exemple : un riad à 200 € payé par Sara, partagé à 50 % avec Alae. Sara a payé 200 € et
      sa part est de 100 € : son solde est +100 €. Alae n'a rien payé et sa part est de 100 € :
      son solde est −100 €, il doit 100 € à Sara.
    keywords: [200, 100, Sara, Alae]
    questions:
      - Tu peux me donner un exemple de calcul de solde ?
      - Explique le solde avec un exemple
      - Un exemple concret de partage ?
      - Comment ça marche avec un exemple ?
      - Montre-moi comment le solde est calculé sur un cas réel
      - Donne-moi un exemple de dépense partagée
      - Exemple de solde positif et négatif ?
      - Je veux un exemple simple de répartition
      - Illustre-moi le calcul des soldes
      - Cas pratique de partage d'une dépense ?

  - id: rembourser
    answer: >-
      EquiPay ne fait pas de paiement : il calcule qui doit combien. Le remboursement se fait
      en dehors de l'application (espèces, virement…) en suivant les soldes affichés.
    keywords: [paiement, dehors, soldes]
    questions:
