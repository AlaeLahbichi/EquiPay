# L'environnement d'EquiPay : technologies, données, assistant et projet.
category: environnement

topics:
  - id: technologies
    answer: >-
      EquiPay est développée avec Flutter pour l'application mobile, Supabase pour la base de
      données, la connexion et le stockage des photos, et un serveur Python (FastAPI) pour
      l'assistant.
    keywords: [Flutter, Supabase, Python, FastAPI]
    questions:
      - Avec quelles technologies EquiPay a été développée ?
      - Quel langage utilise EquiPay ?
      - C'est quoi la stack technique de l'app ?
      - EquiPay est codée en quoi ?
      - Quels outils ont servi à créer l'application ?
      - Quelle est l'architecture d'EquiPay ?
      - What tech stack does EquiPay use?
      - Which framework was used to build the app?
      - B ach tkhdmat EquiPay ?
      - Quelles technologies se cachent derrière l'app ?
      - EquiPay utilise quel framework mobile ?

