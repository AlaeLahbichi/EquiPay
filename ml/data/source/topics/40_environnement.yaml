  - id: notifications
    answer: >-
      Quand l'application est ouverte, EquiPay te prévient par une bannière en bas de l'écran
      et un compteur sur l'onglet Requests. Les notifications quand l'application est fermée
      ne sont pas encore disponibles.
    keywords: [ouverte, bannière, Requests, fermée]
    questions:
