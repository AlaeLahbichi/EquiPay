  - id: supabase
    answer: >-
      Les données d'EquiPay sont stockées dans une base de données PostgreSQL hébergée par
      Supabase, qui gère aussi les comptes, les photos et les mises à jour en temps réel.
    keywords: [PostgreSQL, Supabase, comptes, temps réel]
    questions:
      - Où sont stockées mes données ?
      - Quelle base de données utilise EquiPay ?
      - EquiPay utilise Supabase ?
      - Mes dépenses sont enregistrées où ?
      - Qui héberge les données de l'application ?
      - C'est quoi le backend d'EquiPay ?
      - Where is my data stored?
      - Which database does EquiPay use?
      - Fin kaytsajlo les données ?
      - Les données sont dans le cloud ?
      - EquiPay a un serveur ?

  - id: securite_technique
    answer: >-
      La sécurité repose sur des règles d'accès dans la base de données (Row Level Security) :
      chaque requête vérifie que tu es bien membre de l'activité, et seul l'owner peut faire
      les actions de gestion. Les mots de passe sont gérés par le service d'authentification
      et ne sont jamais stockés en clair.
    keywords: [Row Level Security, membre, owner, mots de passe]
    questions:
      - Comment EquiPay sécurise les accès techniquement ?
      - Comment l'app empêche un inconnu de lire mes dépenses ?
      - Mon mot de passe est stocké en clair ?
      - Comment sont protégés les mots de passe ?
      - C'est quoi Row Level Security ?
      - La sécurité est gérée côté serveur ?
      - How does EquiPay secure data access?
      - Kifach kayt7ma l'accès techniquement ?
      - Un pirate peut modifier mes dépenses ?
      - Les règles d'accès sont vérifiées où ?

  - id: temps_reel_technique
    answer: >-
      Le temps réel vient de Supabase : l'application est abonnée aux changements de la base
      de données, et dès qu'une dépense, un membre ou une demande change, ton téléphone reçoit
      la mise à jour sans recharger.
    keywords: [Supabase, abonnée, changements, sans recharger]
    questions:
      - Comment marche le temps réel techniquement ?
      - Comment les autres reçoivent mes dépenses instantanément ?
      - Par quel mécanisme les soldes se mettent à jour tout seuls ?
      - Comment fonctionne la synchronisation ?
      - How does real-time sync work?
      - Kifach kaykhdem temps réel ?
      - Comment je reçois les demandes sans rafraîchir ?
      - La mise à jour automatique utilise quoi ?

  - id: assistant_modele
    answer: >-
      L'assistant est un modèle de langage open source, Qwen3-4B, affiné avec la méthode LoRA
      sur des milliers de questions et réponses sur EquiPay. Il tourne sur un serveur EquiPay
      et ne sert qu'à répondre aux questions sur l'application.
    keywords: [Qwen3-4B, LoRA, questions, serveur]
    questions:
      - Quel modèle d'IA utilise l'assistant ?
      - Tu es basé sur quel modèle ?
      - Comment fonctionne l'assistant techniquement ?
      - Tu tournes sur quel modèle ?
      - Quel LLM est derrière l'assistant ?
      - Tu es un modèle Qwen ?
      - Which AI model powers the assistant?
      - Chno howa lmodel li khdam b ih l'assistant ?
      - L'assistant utilise une API externe ?
      - Tu es un modèle open source ?

  - id: assistant_entrainement
    answer: >-
      J'ai été entraîné sur un jeu de questions et réponses sur EquiPay, le partage des
      dépenses et les applications similaires. Chaque version est évaluée et suivie avec
      MLflow, puis la meilleure est choisie pour répondre dans l'application.
    keywords: [questions et réponses, évaluée, MLflow, meilleure]
    questions:
      - Comment as-tu été entraîné ?
      - Sur quelles données es-tu entraîné ?
      - Comment l'assistant a été créé ?
      - Qui t'a appris à répondre ?
