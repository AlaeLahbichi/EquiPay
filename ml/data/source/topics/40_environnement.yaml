  - id: interface
    answer: >-
      EquiPay a une interface simple aux couleurs turquoise (lagon) et orange : une barre de 4
      onglets en bas, le bouton rond orange « + » pour créer ou rejoindre une activité, un
      mode clair et un mode sombre.
    keywords: [4 onglets, +, mode sombre]
