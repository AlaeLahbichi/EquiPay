      - Wach khass nconfirmi l'email ?
      - L'inscription est immédiate ?
      - Combien de temps pour que mon compte soit validé ?

  - id: mot_de_passe_regles
    answer: >-
      Ton mot de passe doit contenir au moins 6 caractères. Si l'app affiche « Mot de passe
      trop faible », choisis-en un plus long.
    keywords: [6 caractères, Mot de passe trop faible]
    questions:
      - Combien de caractères pour le mot de passe ?
      - Pourquoi mon mot de passe est refusé ?
      - Mot de passe trop faible, ça veut dire quoi ?
