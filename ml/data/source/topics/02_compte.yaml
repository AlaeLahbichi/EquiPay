# Compte, connexion et profil.
category: compte

topics:
  - id: connexion
    answer: >-
      Va dans l'onglet Profile : appuie sur « Continuer avec un email » pour te connecter avec
      ton email et ton mot de passe, ou sur « Continuer avec Google » pour utiliser ton compte
      Google (Gmail).
    keywords: [Profile, Continuer avec un email, Continuer avec Google]
    questions:
      - Comment je me connecte ?
      - Comment se connecter à EquiPay ?
      - Je peux me connecter avec Gmail ?
      - Quelles sont les méthodes de connexion ?
      - On peut se connecter avec Google ?
      - Je veux me connecter, je fais comment ?
