  - id: identifiants_incorrects
    answer: >-
      « Email ou mot de passe incorrect » veut dire que l'email ou le mot de passe saisi ne
      correspond à aucun compte : vérifie l'adresse, les majuscules du mot de passe, ou crée
      un compte si tu n'en as pas encore.
    keywords: [Email ou mot de passe incorrect, vérifie, compte]
    questions:
      - Pourquoi il me dit email ou mot de passe incorrect ?
      - Je n'arrive pas à me connecter avec mon email
      - Mes identifiants ne marchent pas
