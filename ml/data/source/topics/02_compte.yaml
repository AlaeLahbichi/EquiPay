  - id: username_pris
    answer: >-
      Chaque pseudo est unique : si celui que tu veux est déjà utilisé par quelqu'un d'autre,
      l'app le refuse. Choisis-en un autre, par exemple en ajoutant des chiffres ou un « _ ».
    keywords: [unique, déjà utilisé, chiffres]
    questions:
      - Mon nouveau username est refusé, pourquoi ?
      - Pourquoi ce username n'est pas disponible ?
      - Le pseudo que je veux est déjà pris
