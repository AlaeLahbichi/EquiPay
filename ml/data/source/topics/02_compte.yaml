  - id: supprimer_compte
    answer: >-
      Dans l'onglet Profile, appuie sur « Supprimer mon compte » puis confirme. Attention :
      ton profil, les activités que tu as créées et tes dépenses sont supprimés
      définitivement, l'action est irréversible.
    keywords: [Profile, Supprimer mon compte, définitivement, irréversible]
    questions:
      - Comment supprimer mon compte ?
      - Je veux effacer mon compte EquiPay
      - Comment fermer définitivement mon compte ?
