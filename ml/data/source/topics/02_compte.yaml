      - Pourquoi mon pseudo finit par des nombres ?
      - How is my username chosen?
      - Mnin ja had pseudo dyali ?
      - Je n'ai jamais choisi de pseudo, d'où il vient ?

  - id: changer_username
    answer: >-
      Dans l'onglet Profile, appuie sur « Modifier mes informations » et change ton pseudo. Il
      doit être unique et faire 3 à 30 caractères : lettres minuscules, chiffres et « _ ».
    keywords: [Modifier mes informations, pseudo, unique, 3, 30]
    questions:
      - Comment changer mon username ?
      - Je peux modifier mon pseudo ?
      - Quelles sont les règles pour le nom d'utilisateur ?
      - Je peux mettre des majuscules dans mon username ?
