      - Comment résilier mon compte ?

  - id: changer_email
    answer: >-
      Dans l'onglet Profile, appuie sur « Modifier mes informations », remplace ton email puis
      appuie sur « Enregistrer ». Si un email de confirmation t'est envoyé, ouvre le lien pour
      valider ta nouvelle adresse.
    keywords: [Profile, Modifier mes informations, email, Enregistrer]
    questions:
