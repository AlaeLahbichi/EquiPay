      - Comment ouvrir une session ?
      - Quels identifiants utiliser pour entrer dans l'app ?
      - Où est le bouton pour se connecter ?
      - How do I log in?
      - Can I sign in with Google?
      - Kifach ndir connexion ?
      - Fin kayn bouton dyal login ?
      - J'ai déjà un compte, comment je rentre ?

  - id: inscription
    answer: >-
      Dans l'onglet Profile, appuie sur « Continuer avec un email », choisis « Inscription »,
      puis remplis ton prénom, ton nom, ton email et un mot de passe et appuie sur « Créer mon
      compte ». Tu peux aussi t'inscrire directement avec « Continuer avec Google ».
    keywords: [Profile, Inscription, email, mot de passe, Créer mon compte]
    questions:
      - Comment créer un compte ?
      - Comment je m'inscris ?
      - Je n'ai pas de compte, que faire ?
      - Comment ouvrir un compte EquiPay ?
      - L'inscription se fait comment ?
      - Comment m'enregistrer ?
      - C'est quoi les étapes pour s'inscrire ?
      - Créer un compte avec Gmail c'est possible ?
      - Quelles infos faut-il pour s'inscrire ?
      - How do I create an account?
      - How can I sign up?
      - Kifach n7el compte jdid ?
      - Bghit ndir inscription
      - Où est le formulaire d'inscription ?
      - Il faut quoi pour créer un compte EquiPay ?
      - L'inscription est longue ?

  - id: compte_cree
    answer: >-
      Après « Créer mon compte », ton compte est créé et tu es connecté directement : ton
      profil est créé automatiquement et tu peux commencer à créer ou rejoindre des
      activités.
    keywords: [compte, connecté, profil, automatiquement]
    questions:
      - J'ai créé mon compte, et maintenant ?
      - Il faut confirmer mon email après l'inscription ?
      - Mon compte est actif tout de suite ?
