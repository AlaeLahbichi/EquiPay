  - id: username_auto
    answer: >-
      À l'inscription, ton pseudo (username) est créé automatiquement à partir du début de ton
      email ; s'il est déjà pris, des chiffres sont ajoutés. Tu peux le changer avec
      « Modifier mes informations » dans l'onglet Profile.
    keywords: [pseudo, email, chiffres, Modifier mes informations]
    questions:
      - Comment est choisi mon username ?
      - D'où vient mon nom d'utilisateur ?
      - Pourquoi mon username a des chiffres ?
      - Comment est créé mon pseudo ?
      - Mon nom d'utilisateur a été généré comment ?
