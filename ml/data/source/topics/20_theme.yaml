# Le thème : partager des dépenses en groupe (conseils et cas pratiques),
# toujours relié à la façon de le faire dans EquiPay.
category: theme

topics:
  - id: egal_ou_equitable
    answer: >-
      Partager à parts égales, c'est diviser le montant par le nombre de personnes. Partager
      équitablement, c'est tenir compte de ce que chacun a consommé ou de sa situation. Dans
      EquiPay, les pourcentages de chaque dépense permettent les deux.
    keywords: [parts égales, équitablement, pourcentages]
    questions:
      - Quelle différence entre partage égal et partage équitable ?
      - Vaut-il mieux partager à parts égales ou au prorata ?
      - C'est quoi un partage équitable ?
      - Faut-il toujours diviser en parts égales ?
      - Comment partager de façon juste entre amis ?
      - What is the difference between equal and fair split?
      - Partage égal ou équitable, lequel choisir ?
      - Kifach n9essmo b l3adl ?
      - Est-ce juste que tout le monde paie pareil ?
      - Partage équitable ou égalitaire pour un voyage ?

  - id: prorata_revenus
    answer: >-
      Pour partager selon les revenus, calcule la part de chacun dans le total des revenus. Par
      exemple, si l'un gagne 2 000 € et l'autre 1 000 €, le premier paie 67 % et le second
      33 %. Dans EquiPay, indique ces pourcentages dans la dépense.
    keywords: [revenus, 67, 33, pourcentages]
    questions:
      - Comment partager selon les salaires ?
      - Partager au prorata des revenus, comment faire ?
