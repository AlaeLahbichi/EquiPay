  - id: avance_ou_cagnotte
    answer: >-
      Il y a deux méthodes : une cagnotte commune où chacun verse la même somme au départ, ou
      chacun avance les dépenses et on fait les comptes à la fin. EquiPay est fait pour la
      seconde : chacun note ce qu'il paie et les soldes indiquent qui rembourse qui.
    keywords: [cagnotte, avance, soldes]
    questions:
