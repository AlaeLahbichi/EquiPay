  - id: apps_paiement
    answer: >-
      Lydia, PayPal ou Wise sont des services pour envoyer de l'argent. EquiPay ne fait pas de
      paiement : il calcule qui doit combien, puis le remboursement peut se faire avec l'outil
      de paiement de ton choix.
    keywords: [Lydia, PayPal, paiement, remboursement]
    questions:
      - EquiPay c'est comme Lydia ?
      - Quelle différence entre EquiPay et PayPal ?
      - EquiPay remplace Lydia ?
      - Je peux rembourser avec PayPal ?
      - EquiPay est une app de paiement comme Wise ?
      - Is EquiPay like PayPal?
      - EquiPay bhal CashPlus ?
      - Je peux utiliser Lydia avec EquiPay ?
      - Faut-il une app de paiement en plus d'EquiPay ?

  - id: vs_excel
    answer: >-
      Un tableur comme Excel ou Google Sheets peut suivre des dépenses, mais il faut faire les
      calculs et le partager à la main. EquiPay calcule les soldes automatiquement et chaque
      membre voit les mêmes chiffres en temps réel sur son téléphone.
    keywords: [Excel, calculs, soldes, temps réel]
    questions:
      - Pourquoi ne pas utiliser un fichier Excel ?
      - EquiPay ou un tableau Google Sheets ?
      - Un tableur suffit pour partager les dépenses ?
      - Quel avantage par rapport à un fichier Excel ?
      - On faisait nos comptes sur Excel, pourquoi changer ?
      - Why not just use a spreadsheet?
      - 3lach mandirch Excel ?
      - EquiPay vs Google Sheets pour la coloc ?

  - id: vs_whatsapp_notes
    answer: >-
      Noter les dépenses dans un groupe WhatsApp ou sur un carnet devient vite confus : on
      perd des messages et il faut tout recalculer. Dans EquiPay, chaque dépense est
      enregistrée au même endroit et les soldes se calculent tout seuls.
    keywords: [WhatsApp, carnet, soldes]
    questions:
      - Pourquoi ne pas juste noter dans le groupe WhatsApp ?
      - On note nos dépenses sur un papier, c'est suffisant ?
      - EquiPay vs les notes du téléphone ?
      - Quel intérêt par rapport à un groupe WhatsApp ?
