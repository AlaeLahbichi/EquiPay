  - id: equipay_maroc
    answer: >-
      EquiPay a été créée dans le cadre d'un projet à l'EMSI, une école d'ingénieurs au
      Maroc. Elle gère le dirham marocain (MAD) parmi ses 12 devises et convient aussi bien
      aux voyages au Maroc qu'à l'étranger.
    keywords: [Maroc, EMSI, dirham, MAD]
