  - id: limites_vs_concurrents
    answer: >-
      Par rapport à des applications plus anciennes, EquiPay ne propose pas encore certaines
      fonctions comme l'export des dépenses ou une version web. C'est une application récente,
      en version 1.0.0, qui va continuer à évoluer.
    keywords: [export, version web, 1.0.0]
    questions:
      - Qu'est-ce qu'EquiPay ne fait pas par rapport à Tricount ?
