  - id: kittysplit
    answer: >-
      Kittysplit est un site web pour partager les dépenses d'un événement sans créer de
      compte : on partage un lien avec le groupe. EquiPay est une application mobile, avec des
      comptes, des rôles et des soldes mis à jour en temps réel.
    keywords: [Kittysplit, site web, lien, temps réel]
    questions:
