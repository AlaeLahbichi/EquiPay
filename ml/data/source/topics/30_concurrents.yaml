      - Is Splitwise free?
      - Chno hiya Splitwise ?
      - Splitwise est payant ?
      - Depuis quand existe Splitwise ?

  - id: equipay_vs_splitwise
    answer: >-
      Splitwise et EquiPay suivent tous les deux les dépenses et les soldes d'un groupe.
      EquiPay se distingue par ses 4 types d'activité (Voyage, Sortie, Quotidien, Crédit), ses
      rôles avec spectateurs et son assistant intégré en français.
    keywords: [Splitwise, 4 types, spectateurs, assistant]
    questions:
      - Quelle différence entre EquiPay et Splitwise ?
