  - id: meilleure_app
    answer: >-
      Il n'y a pas d'application parfaite pour tout le monde : Tricount, Splitwise et EquiPay
      suivent bien les dépenses d'un groupe. EquiPay convient si tu veux contrôler qui
      rejoint ton activité, ajouter des spectateurs et avoir un assistant en français.
    keywords: [Tricount, Splitwise, contrôler, spectateurs, assistant]
    questions:
      - Quelle est la meilleure application pour partager les dépenses ?
      - Quelle app de partage de frais me conseilles-tu ?
      - Quelle est la meilleure alternative à Tricount ?
