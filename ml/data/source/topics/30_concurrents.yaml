# Applications similaires et comparaisons. Faits volontairement stables (pas de prix ni de
# limites qui changent souvent) ; pour le détail à jour, renvoyer vers le site de l'app.
category: concurrents

topics:
  - id: apps_similaires
    answer: >-
      Les applications les plus connues pour partager des dépenses sont Tricount, Splitwise
      et Settle Up, ainsi que des sites comme Spliit ou Kittysplit. EquiPay fait la même chose
      avec des rôles (owner, membre, spectateur) et un assistant intégré.
    keywords: [Tricount, Splitwise, Settle Up, rôles]
    questions:
      - Quelles applications ressemblent à EquiPay ?
      - Il existe d'autres apps pour partager les dépenses ?
      - Quels sont les concurrents d'EquiPay ?
      - Quelles alternatives à EquiPay ?
      - Quelles sont les meilleures apps de partage de frais ?
      - Apps similaires pour gérer les dépenses entre amis ?
      - What are the alternatives to EquiPay?
      - Which apps are similar to EquiPay?
      - Chno homa les applications bhal EquiPay ?
      - Quelles applis pour partager les frais de voyage ?
      - Il y a des concurrents sur le marché ?

  - id: tricount
    answer: >-
      Tricount est une application belge de partage de dépenses entre amis, lancée en 2010 et
      rachetée par la banque en ligne bunq en 2022. Comme EquiPay, elle sert à noter les
      dépenses d'un groupe et à voir qui doit combien.
    keywords: [Tricount, belge, bunq, dépenses]
    questions:
      - C'est quoi Tricount ?
      - Tu connais Tricount ?
      - Tricount appartient à qui ?
      - Tricount ça marche comment ?
      - Tricount est une application de quel pays ?
      - Présente-moi Tricount
      - What is Tricount?
      - Who owns Tricount?
      - Chno hiya Tricount ?
      - Tricount a été racheté par une banque ?
      - Depuis quand existe Tricount ?

  - id: equipay_vs_tricount
    answer: >-
      Tricount et EquiPay servent tous les deux à partager les dépenses d'un groupe. EquiPay
      ajoute des rôles avec un spectateur en lecture seule, une validation par le créateur de
      chaque demande pour rejoindre, et un assistant qui répond en français.
    keywords: [Tricount, spectateur, validation, assistant]
    questions:
      - Quelle différence entre EquiPay et Tricount ?
      - Pourquoi utiliser EquiPay plutôt que Tricount ?
      - EquiPay ou Tricount, lequel choisir ?
      - EquiPay est mieux que Tricount ?
      - Qu'est-ce qu'EquiPay a de plus que Tricount ?
      - Compare EquiPay et Tricount
      - EquiPay vs Tricount?
      - Why EquiPay instead of Tricount?
      - Chno lfar9 bin EquiPay w Tricount ?
      - J'utilise Tricount, pourquoi passer à EquiPay ?
      - EquiPay copie Tricount ?

  - id: splitwise
    answer: >-
      Splitwise est une application américaine lancée en 2011, très utilisée par les
      colocataires et les voyageurs pour suivre les dettes d'un groupe. Elle propose une
      version gratuite et un abonnement payant, Splitwise Pro, avec des fonctions en plus.
    keywords: [Splitwise, américaine, gratuite, Splitwise Pro]
    questions:
      - C'est quoi Splitwise ?
      - Tu connais Splitwise ?
      - Splitwise est gratuit ?
      - Splitwise ça vient d'où ?
      - Présente-moi Splitwise
      - Splitwise Pro, c'est quoi ?
