  - id: onglets
    answer: >-
      La barre du bas a 4 onglets : EquiPay (l'accueil avec tes activités), Requests (les
      demandes pour rejoindre des activités), Free Card (bientôt disponible) et Profile (ton
      profil et tes préférences).
    keywords: [EquiPay, Requests, Free Card, Profile]
    questions:
      - Quels sont les onglets de l'app ?
      - À quoi servent les boutons en bas de l'écran ?
      - Comment est organisée l'application ?
