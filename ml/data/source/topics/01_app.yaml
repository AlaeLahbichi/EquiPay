      - À quoi sert le gros bouton + ?
      - Comment j'accède à un de mes voyages ?
      - Où retrouver mes groupes de dépenses ?

  - id: ordre_activites
    answer: >-
      Tes activités sont affichées de la plus récente à la plus ancienne : celle que tu as
      créée ou rejointe en dernier apparaît en haut de la liste.
    keywords: [plus récente, haut]
    questions:
      - Pourquoi mes activités sont dans cet ordre ?
      - Comment sont triées mes activités ?
      - Pourquoi mon nouveau voyage est en haut ?
      - Dans quel ordre s'affichent les activités ?
