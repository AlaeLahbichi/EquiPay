  - id: premiers_pas
    answer: >-
      Pour bien démarrer : connecte-toi dans l'onglet Profile, puis sur l'accueil appuie sur
      « + » pour créer une activité ou en rejoindre une avec un code. Partage ensuite le code
      de ton activité avec tes amis pour qu'ils te rejoignent.
    keywords: [Profile, +, créer, code]
    questions:
      - Comment bien commencer avec EquiPay ?
      - Je suis nouveau, par où commencer ?
      - Quelles sont les premières étapes ?
      - Comment utiliser l'application pour la première fois ?
      - Tu peux me guider pour démarrer ?
      - Comment ça marche au début ?
      - Mode d'emploi rapide de l'app ?
      - Je viens de télécharger l'app, je fais quoi maintenant ?
      - How do I get started?
      - Kifach nbda nkhdem b EquiPay ?
      - Guide de démarrage d'EquiPay ?
      - Explique-moi comment utiliser EquiPay étape par étape
      - Comment organiser mon premier voyage avec l'app ?
      - Quelle est la première chose à faire dans l'application ?

  - id: deconnecte_accueil
    answer: >-
      Sans être connecté, l'accueil affiche « Connecte-toi pour commencer ». Appuie sur
      « Se connecter » ou va dans l'onglet Profile pour te connecter et voir tes activités.
    keywords: [Connecte-toi, Se connecter, Profile]
    questions:
