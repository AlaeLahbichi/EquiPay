  - id: langue
    answer: >-
      Dans l'onglet Profile, section Préférences, appuie sur « Langue » pour choisir entre
      l'arabe, le français et l'anglais. Ton choix est enregistré ; pour l'instant
      l'application est affichée en français, les traductions arrivent bientôt.
    keywords: [Profile, Préférences, Langue, arabe, anglais]
    questions:
      - Comment changer la langue de l'application ?
      - L'app est disponible en anglais ?
