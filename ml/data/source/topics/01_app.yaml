  - id: accueil
    answer: >-
      L'accueil (onglet EquiPay) affiche la liste de tes activités avec leur logo, leur nom et
      une flèche pour ouvrir le détail. Le bouton rond orange « + » en bas permet d'en créer
      une ou d'en rejoindre une.
    keywords: [activités, logo, flèche, +]
    questions:
      - Que montre la page d'accueil ?
      - À quoi sert l'écran principal ?
      - Où je vois mes activités ?
      - Comment ouvrir une activité ?
