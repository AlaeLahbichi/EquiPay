      - How are my activities sorted?
      - Pourquoi la dernière activité rejointe apparaît en premier ?
      - Les activités sont classées par date ?
      - Comment est rangée ma liste d'activités ?

  - id: aucune_activite
    answer: >-
      « Aucune activité » veut dire que tu ne fais encore partie d'aucune activité. Appuie
      sur le bouton « + » pour en créer une ou pour rejoindre celle d'un ami avec son code.
    keywords: [+, créer, rejoindre, code]
    questions:
      - Pourquoi il est écrit aucune activité ?
      - Ma liste est vide, c'est normal ?
      - Je ne vois aucun voyage, pourquoi ?
      - Je viens de m'inscrire, je ne vois rien
      - L'accueil est vide, que faire ?
      - Pourquoi je n'ai pas d'activité ?
