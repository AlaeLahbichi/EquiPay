  - id: roles
    answer: >-
      Il y a 3 rôles : l'owner (le créateur) gère l'activité et ses participants ; le membre
      voit tout et gère ses propres dépenses ; le spectateur peut seulement regarder, sans
      ajouter de dépense.
    keywords: [owner, membre, spectateur]
    questions:
      - Quels sont les rôles dans une activité ?
      - C'est quoi la différence entre membre et spectateur ?
      - Qui peut faire quoi dans un voyage ?
