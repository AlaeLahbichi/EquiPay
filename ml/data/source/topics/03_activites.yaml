  - id: devise_verrouillee
    answer: >-
      Dès qu'une activité contient des dépenses, sa devise ne peut plus être changée : chaque
      dépense garde un taux de change vers cette devise, et les totaux deviendraient faux. Le
      champ devise apparaît alors grisé avec un cadenas.
    keywords: [dépenses, taux de change, cadenas]
    questions:
      - Pourquoi je ne peux plus changer la devise ?
      - Le champ devise est grisé, pourquoi ?
      - Pourquoi il y a un cadenas sur la devise ?
