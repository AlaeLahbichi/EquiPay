  - id: spectateur
    answer: >-
      Un spectateur peut voir l'activité, les dépenses et les soldes, mais il ne peut pas
      ajouter de dépense et ne participe à aucune dépense. Seul l'owner peut le passer en
      membre.
    keywords: [voir, ne peut pas, dépense, owner]
    questions:
