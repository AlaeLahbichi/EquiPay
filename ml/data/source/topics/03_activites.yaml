  - id: liste_devises
    answer: >-
      EquiPay propose 12 devises : euro (EUR), dirham marocain (MAD), dollar américain (USD),
      livre sterling (GBP), franc suisse (CHF), dollar canadien (CAD), livre turque (TRY),
      dirham des Émirats (AED), riyal saoudien (SAR), dinar tunisien (TND), dinar algérien
      (DZD) et yen japonais (JPY).
    keywords: [12, EUR, MAD, USD]
    questions:
      - Quelles devises sont disponibles ?
