  - id: type_quotidien_credit
    answer: >-
      Quotidien sert aux dépenses courantes partagées, comme les courses ou les factures d'une
      colocation. Crédit sert à suivre un prêt ou une dette entre amis : qui a avancé l'argent
      et combien il reste à rembourser.
    keywords: [Quotidien, colocation, Crédit, prêt]
    questions:
      - C'est quoi le type Quotidien ?
      - À quoi sert le type Crédit ?
      - Quelle différence entre Quotidien et Crédit ?
