# Activités : création, détail, modification, rôles et gestion des participants.
category: activites

topics:
  - id: types_activite
    answer: >-
      Il existe 4 types d'activité : Voyage, Sortie, Quotidien (dépenses du quotidien) et
      Crédit. Tu choisis le type quand tu crées l'activité.
    keywords: [Voyage, Sortie, Quotidien, Crédit]
    questions:
