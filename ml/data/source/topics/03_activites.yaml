  - id: devise_creation
    answer: >-
      À la création, choisis la devise dans le champ « Devise » : toutes les dépenses de
      l'activité seront calculées dans cette devise. Il n'y a pas de devise par défaut, tu
      dois la choisir.
    keywords: [Devise, dépenses, choisir]
    questions:
      - Comment choisir la devise d'une activité ?
      - Où je mets la monnaie du voyage ?
