  - id: changer_devise
    answer: >-
      Si tu es l'owner, ouvre l'activité, appuie sur le crayon « Modifier l'activité », choisis
      une autre devise puis « Enregistrer ». Les montants s'affichent ensuite dans la nouvelle
      devise.
    keywords: [owner, Modifier l'activité, devise, Enregistrer]
