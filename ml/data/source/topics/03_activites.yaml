      - Créateur, Membre, Spectateur, quelle différence ?

  - id: owner
    answer: >-
      L'owner est le créateur de l'activité : il voit et partage le code, accepte ou refuse
      les demandes, change les rôles, retire des participants et modifie le titre, la photo et
      la devise.
    keywords: [créateur, code, demandes, rôles]
    questions:
      - Que peut faire l'owner ?
      - C'est quoi le rôle du créateur ?
      - Quels sont les droits de l'owner ?
