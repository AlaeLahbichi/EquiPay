  - id: membre
    answer: >-
      Un membre voit toute l'activité, les dépenses et les soldes. Il peut ajouter des
      dépenses et modifier ou supprimer celles qu'il a créées, mais il ne gère pas les
      participants.
    keywords: [membre, dépenses, soldes, participants]
    questions:
      - Que peut faire un membre ?
      - Je suis membre, j'ai quels droits ?
      - Un membre peut ajouter des dépenses ?
