      - Combien d'activités je peux rejoindre en même temps ?
      - Je suis dans un voyage, je peux en rejoindre un autre ?

  - id: tout_le_monde_na_pas_participe
    answer: >-
      Si tout le monde n'a pas participé, par exemple à une excursion, ajoute la dépense
      seulement entre les personnes concernées : les autres n'ont pas de part et leur solde ne
      change pas.
    keywords: [personnes concernées, part, solde]
    questions:
      - Tout le monde n'a pas fait l'excursion, comment partager ?
      - Seulement deux amis ont pris le taxi, comment faire ?
      - Une dépense ne concerne qu'une partie du groupe
      - Comment exclure quelqu'un d'une dépense ?
      - Mon ami n'était pas là au dîner, il doit payer ?
      - How do I split an expense with only some members?
      - Machi kolchi chark f had dépense
      - Partager une dépense entre deux personnes seulement dans un groupe de six

  - id: depart_colocataire
    answer: >-
      Quand un colocataire part, faites les comptes : il règle son solde ou on le rembourse
      jusqu'à 0. Comme il a des dépenses, l'owner ne peut pas le retirer : il le passe en
      spectateur pour qu'il ne participe plus aux nouvelles dépenses.
    keywords: [solde, 0, spectateur]
    questions:
      - Un colocataire quitte l'appartement, que faire dans l'app ?
      - Comment gérer le départ d'un coloc ?
      - Mon coloc déménage, comment solder ses comptes ?
      - Un membre quitte définitivement le groupe, que faire ?
      - Comment arrêter d'inclure quelqu'un dans les dépenses ?
      - A roommate is moving out, what should we do?
      - Wa7ed mn la coloc ghadi ykhrej
      - Comment clôturer la participation d'un ami ?

  - id: abonnement_partage
    answer: >-
      Pour un abonnement partagé (streaming, internet, salle de sport), crée une activité
      Quotidien et ajoute chaque mois la dépense payée par le titulaire, partagée entre tous
      les utilisateurs de l'abonnement.
    keywords: [abonnement, Quotidien, chaque mois]
    questions:
      - Comment partager un abonnement Netflix entre amis ?
      - On partage un compte Spotify famille, comment diviser ?
      - Comment partager la box internet entre plusieurs personnes ?
      - Abonnement de salle de sport en commun, comment gérer ?
      - Comment rembourser celui qui paie l'abonnement ?
      - How do we share a subscription?
      - Kifach n9essmo abonnement ?
      - Partage d'un forfait familial

  - id: location_terrain
    answer: >-
      Pour un foot à cinq ou un terrain loué entre amis, celui qui réserve ajoute la dépense
      dans une activité Sortie et la partage à parts égales entre les joueurs présents.
    keywords: [Sortie, parts égales, joueurs]
    questions:
      - Comment partager la location d'un terrain de foot ?
      - On loue un terrain chaque semaine, comment gérer ?
      - Comment diviser les frais d'un match entre amis ?
      - Qui paie le terrain de padel ?
      - Partager le prix d'une salle louée
      - How do we split a football pitch rental?
      - Kifach n9essmo kra dyal terrain ?
      - Frais de sport en groupe, quelle méthode ?

  - id: toujours_le_meme_payeur
    answer: >-
      Si c'est toujours la même personne qui paie, son solde devient très positif. Regardez les
      soldes régulièrement : les autres peuvent la rembourser ou payer les prochaines
      dépenses à leur tour.
    keywords: [solde, positif, rembourser, à leur tour]
    questions:
      - C'est toujours moi qui paie, comment rééquilibrer ?
      - Mon ami paie tout, est-ce un problème ?
      - Comment alterner qui paie ?
      - Une seule personne avance tout l'argent du voyage
      - Comment éviter qu'un seul paie toujours ?
      - I always pay, how do we rebalance?
      - Dima ana li kankhelles
      - Mon solde est énorme car je paie tout

  - id: achat_groupe
    answer: >-
      Pour un achat groupé, par exemple des courses en gros ou des billets, la personne qui
      paie ajoute une seule dépense avec le montant total et répartit les pourcentages selon
      ce que chacun reçoit.
    keywords: [achat groupé, montant total, pourcentages]
    questions:
      - Comment partager un achat groupé ?
      - On a acheté des billets de concert ensemble
      - Courses en gros pour plusieurs familles, comment partager ?
      - Un ami a commandé pour tout le monde en ligne
      - Comment gérer une commande commune ?
      - How do we split a group purchase?
      - Chrina 7aja m3a ba3d, kifach n9essmo ?
      - Achat de matériel en commun, qui paie quoi ?

  - id: verifier_avant_rembourser
    answer: >-
      Avant de rembourser, ouvre l'activité et vérifie le total, ce que chacun a payé et les
      soldes. Si une dépense semble fausse, demande à son créateur de la corriger avant de
      faire les virements.
    keywords: [total, soldes, créateur, corriger]
    questions:
      - Comment vérifier les comptes avant de rembourser ?
      - Je pense qu'il y a une erreur dans une dépense
      - Comment contrôler les dépenses du voyage ?
      - Comment être sûr que les soldes sont justes ?
