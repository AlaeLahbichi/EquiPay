  - id: couleurs_solde
    answer: >-
      Dans EquiPay, le vert avec + signifie qu'on te doit de l'argent et le rouge avec −
      signifie que tu dois de l'argent. Sans montant coloré, tu es à l'équilibre.
    keywords: [vert, rouge, équilibre]
    questions:
      - Que veulent dire les couleurs dans l'app ?
