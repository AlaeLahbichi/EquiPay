# Situations concrètes : dépannage, cas pratiques et astuces d'utilisation.
category: situations

topics:
  - id: assistant_injoignable
    answer: >-
      « Impossible de joindre l'assistant » veut dire que ton téléphone n'arrive pas à
      contacter le serveur de l'assistant : vérifie ta connexion internet, puis appuie sur
      « Réessayer » sous le message.
    keywords: [Impossible de joindre l'assistant, connexion, Réessayer]
    questions:
      - Pourquoi l'assistant dit impossible de joindre l'assistant ?
      - L'assistant ne répond pas
      - Le chat d'aide ne marche pas
      - L'assistant met trop de temps à répondre
      - Message d'erreur dans le chat Support
      - The assistant is not answering
      - L'assistant makayjawebch
      - Pourquoi j'ai une bulle rouge dans le chat ?
      - Comment renvoyer ma question à l'assistant ?
      - L'assistant est indisponible, que faire ?

  - id: logo_non_envoye
    answer: >-
      Si l'app affiche « Activité créée, mais le logo n'a pas pu être envoyé », ton activité
      existe bien. Ajoute le logo ensuite : ouvre l'activité, appuie sur le crayon « Modifier
      l'activité » et choisis la photo.
    keywords: [Activité créée, Modifier l'activité, photo]
    questions:
      - Le logo de mon activité n'a pas été envoyé
      - Activité créée mais le logo n'a pas pu être envoyé, que faire ?
      - Mon activité n'a pas de photo alors que j'en avais choisi une
      - La photo du voyage ne s'est pas enregistrée
      - Comment remettre le logo qui a échoué ?
      - The logo upload failed
      - Tswira dyal l'activité ma tsiftatch
      - Pourquoi mon logo n'apparaît pas ?

  - id: email_modifie_confirmation
    answer: >-
      Après un changement d'email, l'app affiche « Informations enregistrées » et peut te
      demander de confirmer la nouvelle adresse avec le lien reçu par email. Ouvre ce lien
      pour terminer le changement.
    keywords: [Informations enregistrées, confirmer, lien]
    questions:
      - J'ai changé mon email, je dois confirmer quelque chose ?
      - Pourquoi mon nouvel email n'apparaît pas encore ?
      - Confirme ton nouvel email, ça veut dire quoi ?
      - Mon changement d'adresse n'est pas pris en compte
      - J'ai reçu un lien après avoir changé mon email
      - Do I need to confirm my new email?
      - Bdelt l'email w mazal ma tbdlch
      - Le message Informations enregistrées veut dire quoi ?

  - id: activite_apparait
    answer: >-
      Dès que le créateur accepte ta demande, l'activité apparaît automatiquement sur ton
      accueil, et une notification te prévient. Tu n'as pas besoin de ressaisir le code.
    keywords: [accepte, accueil, notification]
    questions:
      - Ma demande est acceptée, où est l'activité ?
      - Quand est-ce que l'activité apparaît sur mon accueil ?
      - On m'a accepté, je dois refaire quelque chose ?
      - Je dois ressaisir le code après l'acceptation ?
      - L'activité arrive toute seule dans ma liste ?
      - Where does the activity appear after I'm accepted ?
      - T9belt, fin kayna l'activité ?
      - Comment accéder à l'activité après l'acceptation ?

  - id: ajouter_spectateur
    answer: >-
      Pour ajouter un spectateur, envoie-lui le code : il demande à rejoindre et tu acceptes,
      il arrive comme membre. Touche ensuite son nom dans « Membres » et choisis
      « Spectateur ».
    keywords: [code, accepte, Membres, Spectateur]
    questions:
      - Comment inviter un spectateur ?
      - Comment ajouter quelqu'un en lecture seule ?
      - Comment ajouter mes parents pour qu'ils suivent le voyage ?
      - Je veux qu'une personne voie le voyage sans participer
      - Comment inviter quelqu'un juste pour regarder ?
      - How do I add a viewer?
      - Kifach nzid spectateur ?
      - Ajouter un observateur à mon activité ?
      - Mon père veut suivre nos dépenses sans en ajouter

  - id: une_activite_par_evenement
    answer: >-
      Le plus clair est de créer une activité par événement : une pour chaque voyage ou
      soirée. Pour la colocation, une seule activité Quotidien suffit et sert toute l'année.
    keywords: [une activité par événement, voyage, Quotidien]
    questions:
      - Je crée une activité par voyage ou une seule pour tout ?
      - Faut-il une nouvelle activité pour chaque sortie ?
      - Comment organiser plusieurs voyages avec les mêmes amis ?
      - Une activité pour toute l'année de coloc, c'est bien ?
      - Combien d'activités créer pour mon groupe d'amis ?
      - Should I create one activity per trip?
      - Ndir activité wa7da wla bzaf ?
      - Mélanger tous nos voyages dans une activité, bonne idée ?

  - id: meme_nom_activite
    answer: >-
      Oui, deux activités peuvent avoir le même nom. Pour les distinguer, donne-leur un logo
      différent ou ajoute l'année au titre, par exemple « Marrakech 2026 ».
    keywords: [même nom, logo, Marrakech 2026]
    questions:
      - Deux activités peuvent avoir le même nom ?
      - J'ai deux voyages Marrakech, comment les différencier ?
      - Comment distinguer deux activités qui se ressemblent ?
      - Le nom de l'activité doit être unique ?
      - Can two activities have the same name?
      - Jouj activités b nfs smiya ?
      - Mes activités ont le même titre, c'est un problème ?
      - Comment bien nommer mes activités ?

  - id: plusieurs_demandes
    answer: >-
      Oui, tu peux envoyer des demandes pour plusieurs activités en même temps : chacune
      apparaît dans Requests, section « Envoyées », avec son propre statut.
    keywords: [plusieurs activités, Envoyées, statut]
    questions:
      - Je peux demander à rejoindre plusieurs activités ?
      - Je peux être dans plusieurs voyages à la fois ?
      - J'ai envoyé trois demandes, c'est possible ?
      - On peut faire partie de plusieurs groupes ?
